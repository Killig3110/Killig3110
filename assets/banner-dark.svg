<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Huỳnh Thanh Duy — Software Engineer">
<style>
.mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.sans{font-family:'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif}
@keyframes floaty{0%,100%{transform:translate(1110px,114px) rotate(8deg)}50%{transform:translate(1110px,104px) rotate(3deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%{r:6;opacity:1}100%{r:16;opacity:0}}
.sticker{animation:floaty 4s ease-in-out infinite}
.star{transform-origin:0 0;animation:spin 10s linear infinite}
.track{transform-box:fill-box;animation:slide 28s linear infinite}
.cursor{animation:blink 1s step-end infinite}
.ring{animation:pulse 1.8s ease-out infinite}
</style>
<defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#21262D"/></pattern></defs>
<rect width="1280" height="320" fill="#0D1117"/>
<rect width="1280" height="320" fill="url(#dots)"/>
<circle cx="80" cy="58" r="6" fill="#7EE7C7"/><circle class="ring" cx="80" cy="58" r="6" fill="none" stroke="#7EE7C7" stroke-width="2"/>
<text x="96" y="64" class="mono" font-size="16" fill="#7EE7C7">online — ~/thanh-duy $ whoami</text>
<text x="72" y="160" class="sans" font-size="84" font-weight="700" letter-spacing="-3" fill="#F0F6FC">Huỳnh</text>
<g transform="rotate(-2 520 132)"><rect x="338" y="82" width="430" height="100" rx="16" fill="#F75C7E"/></g>
<text x="356" y="160" class="sans" font-size="84" font-weight="700" letter-spacing="-3" fill="#0D1117">Thanh Duy</text>
<text x="72" y="222" class="mono" font-size="20" font-weight="700" fill="#C9D1D9">&gt; Software Engineer · Backend Specialist</text>
<rect class="cursor" x="560" y="204" width="12" height="22" fill="#F0F6FC"/>
<g transform="translate(910 200)"><g class="star"><path d="M0-26v52M-26 0h52M-18-18l36 36M18-18l-36 36" stroke="#7EE7C7" stroke-width="4" stroke-linecap="round" fill="none"/></g></g>
<g class="sticker"><circle r="80" cx="6" cy="6" fill="#F75C7E"/><circle r="80" fill="#F2CC60"/>
<text text-anchor="middle" class="sans" font-size="24" font-weight="700" fill="#0D1117"><tspan x="0" y="-18">learn</tspan><tspan x="0" y="10">build</tspan><tspan x="0" y="38">ship</tspan></text></g>
<rect y="264" width="1280" height="56" fill="#F75C7E"/>
<g class="track"><text y="300" class="sans" font-size="22" font-weight="700" fill="#0D1117"><tspan x="40"><tspan>JAVA</tspan><tspan dx="22">✳</tspan><tspan dx="22"></tspan><tspan>SPRING BOOT</tspan><tspan dx="22">✳</tspan><tspan dx="22"></tspan><tspan>NODE.JS</tspan><tspan dx="22">✳</tspan><tspan dx="22"></tspan><tspan>MICROSERVICES</tspan><tspan dx="22">✳</tspan><tspan dx="22"></tspan><tspan>AI / NLP</tspan><tspan dx="22">✳</tspan><tspan dx="22"></tspan><tspan>SYSTEM DESIGN</tspan><tspan dx="22">✳</tspan><tspan dx="22"></tspan><tspan>DOCKER</tspan><tspan dx="22">✳</tspan><tspan dx="22"></tspan><tspan>REDIS</tspan><tspan dx="22">✳</tspan><tspan dx="22"></tspan></tspan><tspan>JAVA</tspan><tspan dx="22">✳</tspan><tspan dx="22"></tspan><tspan>SPRING BOOT</tspan><tspan dx="22">✳</tspan><tspan dx="22"></tspan><tspan>NODE.JS</tspan><tspan dx="22">✳</tspan><tspan dx="22"></tspan><tspan>MICROSERVICES</tspan><tspan dx="22">✳</tspan><tspan dx="22"></tspan><tspan>AI / NLP</tspan><tspan dx="22">✳</tspan><tspan dx="22"></tspan><tspan>SYSTEM DESIGN</tspan><tspan dx="22">✳</tspan><tspan dx="22"></tspan><tspan>DOCKER</tspan><tspan dx="22">✳</tspan><tspan dx="22"></tspan><tspan>REDIS</tspan><tspan dx="22">✳</tspan><tspan dx="22"></tspan></text></g>
