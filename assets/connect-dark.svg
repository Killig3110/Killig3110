<svg xmlns="http://www.w3.org/2000/svg" width="880" height="220" viewBox="0 0 880 220" role="img" aria-label="Let's build something cool.">
<style>.m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.s{font-family:'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.g{animation:glow 2.4s ease-in-out infinite}
.r{animation:rise .6s ease-out both}
@keyframes spin{to{transform:rotate(360deg)}}.sp{transform-origin:0 0;animation:spin 14s linear infinite}</style>
